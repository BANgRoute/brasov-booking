<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>Cargocicleta Brașov — Rezervări</title>
<style>
  :root {
    --primary: #2f0094;
    --primary-dark: #210069;
    --primary-light: #6d3bff;
    --dark: #0b1024;
    --bg: #f8f7fc;
    --card-bg: #ffffff;
    --text: #0b1024;
    --muted: #5c5f78;
    --border: #e6e4f1;
    --radius-lg: 22px;
    --radius-md: 16px;
    --safe-l: max(16px, env(safe-area-inset-left));
    --safe-r: max(16px, env(safe-area-inset-right));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: max(28px, env(safe-area-inset-top)) var(--safe-r) 34px var(--safe-l);
    background: var(--dark);
    color: #fff;
    border-radius: 0 0 28px 28px;
  }
  header::before {
    content: "";
    position: absolute;
    inset: -40% -20% auto -20%;
    height: 260px;
    background: radial-gradient(closest-side, rgba(109,59,255,0.55), transparent 70%);
    pointer-events: none;
  }
  header .brand-logo {
    position: relative;
    display: block;
    height: 46px;
    width: auto;
    margin: 0 auto 18px;
    background: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  }
  header .eyebrow {
    position: relative;
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #c9bfff;
    background: rgba(109,59,255,0.18);
    border: 1px solid rgba(109,59,255,0.4);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  header h1 {
    position: relative;
    margin: 0 0 8px;
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    letter-spacing: -0.01em;
  }
  header p {
    position: relative;
    margin: 0;
    color: #c7c9de;
    font-size: clamp(0.92rem, 3.4vw, 1rem);
    max-width: 480px;
    margin-inline: auto;
    line-height: 1.5;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px var(--safe-r) 60px var(--safe-l);
  }

  .bikes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  @media (max-width: 480px) {
    /* One bike fills the screen at a time; swipe left/right through
       Bullitt -> Omnium -> Tricicletă cargo in order. Cards are slightly
       narrower than the viewport so the next one peeks in at the edge —
       a visual cue that there's more to swipe to. */
    .bikes {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      gap: 12px;
      padding-right: 14%;
    }
    .bikes::-webkit-scrollbar { display: none; }
    .bike-card {
      flex: 0 0 86%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
  }

  .swipe-dots {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
  }
  @media (max-width: 480px) {
    .swipe-dots[data-count]:not([data-count="1"]) { display: flex; }
  }
  .swipe-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border);
    padding: 0;
    border: none;
    transition: background 0.2s, transform 0.2s;
  }
  .swipe-dots .dot.active {
    background: var(--primary);
    transform: scale(1.35);
  }

  .bike-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(11,16,36,0.04);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  a.bike-card { cursor: pointer; }
  a.bike-card:hover, a.bike-card:focus-visible {
    border-color: var(--primary-light);
    box-shadow: 0 10px 26px rgba(47,0,148,0.14);
    transform: translateY(-2px);
    outline: none;
  }
  a.bike-card:active { transform: translateY(0); }

  .bike-card.unavailable {
    opacity: 0.55;
    filter: grayscale(0.5);
  }

  .unavailable-badge {
    margin-top: 6px;
    align-self: flex-start;
    background: #f1f0f6;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .bike-card img {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    border-radius: var(--radius-md);
    background: #ece9f7;
  }
  .bike-card h3 {
    margin: 4px 0 0;
    font-size: 1.08rem;
    letter-spacing: -0.01em;
  }
  .bike-card p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
    flex: 1;
    line-height: 1.45;
  }
  .bike-card .book-btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 40px;
    display: inline-flex;
    align-items: center;
  }

  .note {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
    padding: 0 4px;
  }

  footer {
    text-align: center;
    padding: 22px var(--safe-r) max(24px, env(safe-area-inset-bottom)) var(--safe-l);
    font-size: 0.78rem;
    color: var(--muted);
  }
  footer a { color: var(--primary-dark); font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <img class="brand-logo" src="images/rastel-logo.png" alt="Rastel.io">
  <span class="eyebrow">Hub e-cargobiciclete · Brașov</span>
  <h1>Cargocicleta Brașov</h1>
  <p>Alege bicicleta dorită și rezervă un interval direct în calendar.</p>
</header>

<main>
  <div class="bikes" id="bike-list"></div>
  <div class="swipe-dots" id="swipe-dots"></div>
  <p class="note">Dacă bicicleta aleasă nu este disponibilă în intervalul dorit, revino aici și alege altă bicicletă.</p>
</main>

<footer>
  Cargocicleta Brașov · rezervări prin Calendly · un proiect <a href="https://rastel.io" target="_blank" rel="noopener">Rastel.io</a>
</footer>

<script>
  // ---------------------------------------------------------------
  // EDIT HERE: one entry per cargobike. `calendly` must be the full
  // public scheduling link for that bike's Calendly event type.
  // `image` is a path relative to this file (e.g. "images/bullitt.jpg").
  // ---------------------------------------------------------------
  const BIKES = [
    {
      id: "bullitt",
      name: "Bullitt long-john",
      desc: "Cargobike lungă, stabilă, ideală pentru transport de volum mare.",
      image: "images/bullitt.jpg",
      calendly: "https://calendly.com/cargocicleta-2-brasov/30min"
    },
    {
      id: "omnium",
      name: "Omnium short-john",
      desc: "Cargobike compactă, agilă, perfectă pentru oraș.",
      image: "images/omnium.jpg",
      calendly: "https://calendly.com/cargocicleta-1-brasov/30min"
    },
    {
      id: "bike3",
      name: "Tricicletă cargo",
      desc: "Stabilă și cu capacitate mare, ideală pentru mărfuri voluminoase sau grele.",
      image: "",
      calendly: "https://calendly.com/cargocicleta-3-brasov-rastel/30min"
    }
  ];
  // ---------------------------------------------------------------

  // ---------------------------------------------------------------
  // Availability comes from status.json (same folder as this page), not
  // from a URL param — a URL param is visible in the address bar and any
  // visitor can edit it, which defeats the point of marking a bike out of
  // service. status.json is only editable by whoever manages the repo.
  // NOTE: this only hides/greys out a bike on THIS page — it does not stop
  // someone from booking directly at the bike's raw Calendly link. Pause
  // the corresponding Calendly event type when a bike is actually broken.
  // ---------------------------------------------------------------
  async function loadAvailability() {
    try {
      const res = await fetch(`status.json?_=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error("status.json not found");
      const data = await res.json();
      const unavailableIds = new Set((data.unavailable || []).map(String));
      return id => !unavailableIds.has(id);
    } catch (e) {
      // Missing/unreachable status.json (e.g. first deploy) -> default to
      // "everything available" rather than hiding all bikes on an error.
      return () => true;
    }
  }
  let isAvailable = () => true;

  const bikeList = document.getElementById("bike-list");
  const swipeDots = document.getElementById("swipe-dots");

  function placeholderImg(name) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250">
      <rect width="100%" height="100%" fill="#ece9f7"/>
      <text x="50%" y="50%" font-family="sans-serif" font-size="18" fill="#5c5f78"
        text-anchor="middle" dominant-baseline="middle">${name}</text>
    </svg>`;
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  function renderCards() {
    bikeList.innerHTML = "";
    BIKES.forEach(bike => {
      const available = isAvailable(bike.id);
      const card = document.createElement(available ? "a" : "div");
      card.className = "bike-card" + (available ? "" : " unavailable");
      if (available) {
        card.href = bike.calendly;
      }
      card.innerHTML = `
        <img src="${bike.image || placeholderImg(bike.name)}" alt="${bike.name}">
        <h3>${bike.name}</h3>
        <p>${bike.desc}</p>
        ${available
          ? `<span class="book-btn">Rezervă</span>`
          : `<span class="unavailable-badge">Indisponibilă momentan</span>`}
      `;
      bikeList.appendChild(card);
    });
  }

  function renderDots() {
    swipeDots.innerHTML = "";
    swipeDots.setAttribute("data-count", String(BIKES.length));
    BIKES.forEach((bike, i) => {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "dot" + (i === 0 ? " active" : "");
      dot.setAttribute("aria-label", bike.name);
      dot.addEventListener("click", () => {
        const card = bikeList.children[i];
        if (card) card.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
      });
      swipeDots.appendChild(dot);
    });
  }

  // Highlights the dot for whichever card is currently leading the
  // viewport, so the dots double as a "you are here" indicator while
  // swiping, not just a static count.
  function bindSwipeTracking() {
    let ticking = false;
    bikeList.addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const cards = [...bikeList.children];
        const listLeft = bikeList.getBoundingClientRect().left;
        let closest = 0;
        let closestDist = Infinity;
        cards.forEach((card, i) => {
          const dist = Math.abs(card.getBoundingClientRect().left - listLeft);
          if (dist < closestDist) { closestDist = dist; closest = i; }
        });
        [...swipeDots.children].forEach((dot, i) => dot.classList.toggle("active", i === closest));
        ticking = false;
      });
    }, { passive: true });
  }

  (async () => {
    isAvailable = await loadAvailability();
    renderCards();
    renderDots();
    bindSwipeTracking();
  })();
</script>

</body>
</html>
